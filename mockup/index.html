<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rolo">
<link rel="manifest" href="manifest.json">
<title>Rolo</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2EE; --ink:#111110; --grey:#8C8B86; --soft:#D9D7D0; --faint:#E8E6E0; --white:#FBFAF7;
  --mono:'JetBrains Mono',ui-monospace,monospace; --display:'Archivo Black',Archivo,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.grey{color:var(--grey)}
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
main{min-width:0;padding:0 0 96px}
.side{display:none}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px;border-bottom:1px solid var(--ink)}
.title{font-family:var(--display);font-size:52px;line-height:.9;letter-spacing:-.035em;text-transform:uppercase;padding:22px 20px 18px}
.pad{padding:0 20px}

/* bottom nav (phone) */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr) 64px;background:var(--bg);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar button{padding:18px 0;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::before{content:'';display:block;width:5px;height:5px;border-radius:50%;background:var(--ink);margin:0 auto 5px}
.tabbar .add{background:var(--ink);color:var(--white);font-family:Archivo;font-size:26px;font-weight:400;padding:10px 0}

@media (min-width:900px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  .tabbar{display:none}
  main{padding:0}
  .side{display:flex;flex-direction:column;border-right:1px solid var(--ink);position:sticky;top:0;height:100vh}
  .side .brand{font-family:var(--display);font-size:30px;letter-spacing:-.03em;padding:18px 20px 16px;border-bottom:1px solid var(--ink)}
  .side .navbtn{padding:14px 20px;border-bottom:1px solid var(--soft);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);display:flex;justify-content:space-between}
  .side .navbtn.on{color:var(--ink);background:var(--white)}
  .side .grp{padding:9px 20px;font-size:13.5px;display:flex;justify-content:space-between;color:var(--ink)}
  .side .grp span:last-child{font-family:var(--mono);font-size:11px;color:var(--grey)}
  .side .newbtn{margin-top:auto;background:var(--ink);color:var(--white);padding:16px 20px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
  .title{font-size:80px;padding:30px 32px 24px}
  .bar{padding:18px 32px 14px}
  .pad{padding:0 32px}
}

/* filters */
.filters{display:flex;overflow-x:auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);scrollbar-width:none}
.filters button{padding:11px 14px;border-right:1px solid var(--ink);white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.filters button.on{background:var(--ink);color:var(--white)}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--ink)}
.stats button{padding:14px 20px;border-right:1px solid var(--ink)}
.stats button:last-child{border-right:0}
.stats b{display:block;font-family:var(--display);font-size:30px;line-height:1;letter-spacing:-.02em;margin-bottom:6px}

/* orbit */
.orbitwrap{display:grid}
.orbit{width:100%;max-width:560px;margin:0 auto;display:block;padding:10px 6px}
.orbit .node{cursor:pointer;transition:opacity .25s}
.orbit .node:hover circle.face{fill:var(--ink)}
.orbit .node:hover text.ini{fill:var(--white)}
.orbit .dim{opacity:.12}
.legend{display:flex;gap:18px;justify-content:center;padding:0 20px 18px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:7px}
.lg-due{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.lg-ring{width:14px;height:14px;border-radius:50%;border:1px dashed var(--grey)}
@media (min-width:900px){
  .orbitwrap{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);border-bottom:1px solid var(--ink)}
  .orbitwrap>div:first-child{border-right:1px solid var(--ink)}
}

/* list rows */
.sect{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--ink)}
@media (min-width:900px){.sect{padding:14px 32px}}
.ent{display:grid;grid-template-columns:34px 52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--soft);width:100%}
@media (min-width:900px){.ent{padding:12px 32px;grid-template-columns:44px 56px minmax(0,1fr) auto}}
.ent:hover{background:var(--white)}
.ent .n{font-family:var(--mono);font-size:11px;color:var(--grey)}
.ent b{font-family:Archivo;font-weight:600;font-size:17px;letter-spacing:-.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent small{font-family:var(--mono);font-size:11px;color:var(--grey);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph{aspect-ratio:4/5;background:var(--faint);display:grid;place-items:center;font-family:var(--display);color:var(--ink);font-size:17px;letter-spacing:-.02em}
.tagline{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);padding:3px 6px;white-space:nowrap}
.tagline.fill{background:var(--ink);color:var(--white)}
.search{display:flex;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--ink)}
@media (min-width:900px){.search{padding:12px 32px}}
.search input{flex:1;border:0;background:none;font:inherit;outline:none;font-size:15px}

/* person */
.back{padding:16px 20px;display:block}
@media (min-width:900px){.back{padding:16px 32px}}
.profile{display:grid;border-top:1px solid var(--ink)}
@media (min-width:900px){.portrait{aspect-ratio:4/5}.profile{grid-template-columns:360px minmax(0,1fr)}.profile>div:first-child{border-right:1px solid var(--ink)}}
.portrait{aspect-ratio:3/2;background:var(--faint);display:grid;place-items:center;font-family:var(--display);font-size:120px;letter-spacing:-.04em;border-bottom:1px solid var(--ink)}
.pname{font-family:var(--display);font-size:44px;line-height:.92;letter-spacing:-.035em;text-transform:uppercase;padding:20px}
.facts>div{display:grid;grid-template-columns:120px 1fr;padding:11px 20px;border-top:1px solid var(--soft);font-size:14.5px}
.facts>div>span:first-child{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);padding-top:2px}
.rings{display:flex;gap:0;border:1px solid var(--ink);width:max-content}
.rings button{padding:5px 10px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;border-right:1px solid var(--ink)}
.rings button:last-child{border-right:0}
.rings button.on{background:var(--ink);color:var(--white)}
.hook{padding:20px;border-bottom:1px solid var(--ink)}
.hook p{font-family:Archivo;font-weight:500;font-size:24px;line-height:1.2;letter-spacing:-.015em;margin-top:8px}
.note{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:14px 20px;border-bottom:1px solid var(--soft)}
@media (min-width:900px){.hook,.note{padding-left:32px;padding-right:32px}}

/* drill */
.drill{max-width:460px;margin:0 auto;padding:0 20px}
.prog{display:flex;gap:4px;margin:16px 0}
.prog i{flex:1;height:2px;background:var(--soft)}
.prog i.done{background:var(--ink)}
.flip{perspective:1400px;height:460px;cursor:pointer}
.flip-in{position:relative;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--ink);display:flex;flex-direction:column}
.fa{background:var(--ink);color:var(--bg)}
.fa .big{flex:1;display:grid;place-items:center;font-family:var(--display);font-size:140px;letter-spacing:-.05em}
.fa .foot,.fb .foot{display:flex;justify-content:space-between;padding:12px 14px;border-top:1px solid currentColor}
.fb{background:var(--white);transform:rotateY(180deg)}
.fb .pname{padding:18px 14px 14px;font-size:40px}
.fb .facts>div{padding:10px 14px;grid-template-columns:90px 1fr}
.fb .hk{margin-top:auto;padding:14px;border-top:1px solid var(--ink);font-weight:500;font-size:17px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);border-top:0}
.rate button{padding:16px 0;text-align:center;border-right:1px solid var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.rate button:last-child{border-right:0;background:var(--ink);color:var(--white)}

/* groups */
.gl{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:18px 20px;border-bottom:1px solid var(--ink);width:100%}
@media (min-width:900px){.gl{padding:22px 32px}}
.gl:hover{background:var(--white)}
.gl b{font-family:var(--display);font-size:28px;line-height:1;letter-spacing:-.03em;text-transform:uppercase}
.gl .ct{font-family:var(--display);font-size:28px;color:var(--grey)}

/* settings */
.set{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 20px;border-bottom:1px solid var(--soft)}
@media (min-width:900px){.set{padding:16px 32px}}
.set b{font-weight:600;font-size:16px;display:block}
.set small{display:block;color:var(--grey);font-size:13.5px;margin-top:2px;max-width:520px}
.tog{width:52px;height:30px;border:1px solid var(--ink);border-radius:999px;position:relative;flex:none;background:var(--bg);transition:background .2s}
.tog i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.tog.on{background:var(--ink)}
.tog.on i{transform:translateX(22px);background:var(--white)}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(17,17,16,.5);margin-right:8px;vertical-align:middle}
.filters button.on .sw{outline:1px solid var(--white)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:160px;flex:none}
.swb{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(17,17,16,.4)}
.swb.on{outline:1.5px solid var(--ink);outline-offset:2px}
.swl{width:36px;height:36px;border-radius:50%;position:relative;overflow:hidden;flex:none;border:1px solid var(--soft)}
.swl input{position:absolute;inset:-6px;opacity:0;cursor:pointer}
.loginwrap{max-width:640px}
@media (min-width:900px){.fld{padding-left:32px;padding-right:32px}}
.loginnote{padding:14px 20px 30px;color:var(--grey);font-size:13.5px}
@media (min-width:900px){.loginnote{padding:14px 32px 30px}}
.pick{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--ink)}
.pick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px 12px;border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);color:var(--ink)}
.pick button:nth-child(4n){border-right:0}
.pick button:nth-last-child(-n+4){border-bottom:0}
.pick button span{font-size:10px}
.pick button.on{background:var(--ink);color:var(--white)}
#enter:disabled{background:var(--soft);color:var(--grey);cursor:default}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(17,17,16,.25);display:none;z-index:30;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-top:1px solid var(--ink);max-height:92vh;overflow:auto;animation:up .25s ease;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:900px){.scrim{align-items:center}.sheet{border:1px solid var(--ink)}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .title{font-size:40px;padding:20px}
.photo{margin:0 20px 6px;height:120px;border:1px dashed var(--grey);display:grid;place-items:center}
.fld{display:block;padding:12px 20px 10px;border-bottom:1px solid var(--soft)}
.fld input{display:block;width:100%;border:0;background:none;font:inherit;font-size:17px;outline:none;margin-top:4px}
.fld .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;border:1px solid var(--ink);padding:6px 9px}
.opt.on{background:var(--ink);color:var(--white)}
.sheetbtns{display:grid;grid-template-columns:1fr 2fr;border-top:1px solid var(--ink);margin-top:16px}
.sheetbtns button{padding:18px;text-align:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.sheetbtns button:last-child{background:var(--ink);color:var(--white)}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
// Firm palette, sampled from the firms' own brand artwork. Fine-tune in Settings.
const palette = [
  {id:'kwm',    firm:'Mallesons',            name:'Periwinkle',    hex:'#CCCCFE'},
  {id:'kwm2',   firm:'Mallesons',            name:'Blackcurrant',  hex:'#1C1028'},
  {id:'kwm3',   firm:'Mallesons',            name:'Violet',        hex:'#4F3479'},
  {id:'apc',    firm:'Ashurst Perkins Coie', name:'Liberty green', hex:'#00F2B6'},
  {id:'apc2',   firm:'Ashurst Perkins Coie', name:'Deep teal',     hex:'#002D3B'},
  {id:'ash',    firm:'Ashurst (prior)',      name:'Coral',         hex:'#FF5F49'},
  {id:'allens', firm:'Allens',               name:'Blue',          hex:'#0074BF'},
  {id:'allens2',firm:'Allens',               name:'Magenta',       hex:'#AF005F'},
  {id:'hsf',    firm:'HSF Kramer',           name:'Teal',          hex:'#40AAB8'},
  {id:'hsf2',   firm:'HSF Kramer',           name:'Navy',          hex:'#1B3E78'},
];
const P = id => palette.find(x=>x.id===id);
(JSON.parse(localStorage.getItem('rolo-palette')||'[]')).forEach(([id,h])=>{ if(P(id)) P(id).hex=h });
const groups = [
  {id:'cohort',  name:'Clerkship cohort', short:'Cohort',  pc:'kwm'},
  {id:'partners',name:'Partners',         short:'Partners',pc:'apc'},
  {id:'disputes',name:'Disputes team',    short:'Disputes',pc:'ash'},
  {id:'mentors', name:'Mentors',          short:'Mentors', pc:'allens'},
];
groups.forEach(g=>Object.defineProperty(g,'c',{get(){return P(g.pc).hex}}));
// ring: 1 = inner (close), 2 = middle, 3 = outer (acquaintance)
const people = [
  {id:1,first:'Priya',last:'Nair',role:'Senior Associate',team:'Disputes',groups:['disputes','mentors'],ring:1,due:true,met:'Clerkship wk 2, team lunch',hook:'Training for the Sydney marathon',follow:'Thank-you note',notes:[['03 Nov','Offered to review my research memo. Follow up after exams.'],['20 Oct','Grew up in Perth. Loves bouldering.']]},
  {id:2,first:'Tom',last:'Hargreaves',role:'Partner',team:'Banking',groups:['partners'],ring:3,due:true,met:'Welcome drinks',hook:'Coaches junior cricket on Saturdays',follow:'Coffee in Dec',notes:[['01 Nov','Grad program rotates every 6 months.']]},
  {id:3,first:'Mei',last:'Chen',role:'Seasonal Clerk',team:'Corporate',groups:['cohort'],ring:1,met:'Orientation day',hook:'Also Monash, law/commerce',notes:[]},
  {id:4,first:'Jack',last:'Osei',role:'Seasonal Clerk',team:'Disputes',groups:['cohort'],ring:2,due:true,met:'Orientation day',hook:'Plays bass in a band',notes:[]},
  {id:5,first:'Sophie',last:'Laurent',role:'Special Counsel',team:'Competition',groups:['mentors'],ring:2,met:'Women in Law breakfast',hook:'Did an LLM in Paris',follow:'Send ACCC article',notes:[['28 Oct','Happy to chat about competition law.']]},
  {id:6,first:'Ravi',last:'Patel',role:'Seasonal Clerk',team:'Real Estate',groups:['cohort'],ring:2,met:'Orientation day',hook:'Huge F1 fan',notes:[]},
  {id:7,first:'Grace',last:'Kim',role:'Graduate',team:'Tax',groups:['mentors'],ring:1,met:'Law Society mixer',hook:'Gave me interview tips',notes:[]},
  {id:8,first:'Liam',last:"O'Brien",role:'Partner',team:'Disputes',groups:['partners','disputes'],ring:3,due:true,met:'Practice talk, wk 1',hook:'Ex-rower, Irish accent',follow:'Ask about secondment',notes:[]},
  {id:9,first:'Hannah',last:'Brooks',role:'Seasonal Clerk',team:'Banking',groups:['cohort'],ring:3,met:'Orientation day',hook:'Ran the uni debating society',notes:[]},
  {id:10,first:'Daniel',last:'Ng',role:'Associate',team:'Disputes',groups:['disputes'],ring:2,met:'Clerkship wk 2',hook:'Cat called Brief',notes:[]},
  {id:11,first:'Amara',last:'Okafor',role:'Partner',team:'Corporate',groups:['partners'],ring:2,met:'Partner Q&A panel',hook:'Started as a paralegal',notes:[]},
  {id:12,first:'Ben',last:'Walsh',role:'Seasonal Clerk',team:'Tax',groups:['cohort'],ring:3,met:'Orientation day',hook:'Moving to London next year',notes:[]},
];
const pad = n => String(n).padStart(3,'0');
const ini = p => p.first[0]+p.last[0];
const G = id => groups.find(g=>g.id===id);
const inG = (g) => people.filter(p=>p.groups.includes(g));
// colour mode helpers: in B&W mode everything falls back to neutral greys
const gc = p => G(p.groups[0]).c;
// pick ink or white text depending on how light the brand colour is
const lum = h => { const [r,g,b]=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255); return .2126*r+.7152*g+.0722*b };
const on = h => lum(h)>.55 ? '#111110' : '#FBFAF7';
const tint = p => state.colour ? `${gc(p)};color:${on(gc(p))}` : 'var(--faint)';
// solid tint: blend a group colour into the paper colour (keeps orbit lines from showing through)
const mix = (hex,t) => '#'+[1,3,5].map(i=>Math.round(parseInt(hex.substr(i,2),16)*t+[0xF3,0xF2,0xEE][(i-1)/2]*(1-t)).toString(16).padStart(2,'0')).join('');
const deep = p => state.colour ? `${gc(p)};color:${on(gc(p))}` : 'var(--ink)';
const sw = g => state.colour ? `<i class="sw" style="background:${g.c}"></i>` : '';
function setHex(id,h){ P(id).hex=h; localStorage.setItem('rolo-palette',JSON.stringify(palette.map(x=>[x.id,x.hex]))); render() }
function setGroupColour(gid,pid){ groups.find(g=>g.id===gid).pc=pid; render() }
function setColour(on){ state.colour=on; localStorage.setItem('rolo-colour',on?'1':'0'); render() }

let state = {acct:{label:'Ella · Saturn · Crux'}, login:{name:'',planet:null,con:null}, colour: localStorage.getItem('rolo-colour')==='1', view:'orbit', filter:'all', q:'', person:null, fc:{i:0,flipped:false,deck:'all'}};

const nav = [['orbit','Orbit'],['index','Index'],['drill','Drill'],['groups','Groups']];
const gear = `<button class="mono" onclick="go('settings')">Settings</button>`;
function renderNav(){
  const v = state.view==='person'?'index':state.view;
  document.getElementById('side').innerHTML =
    `<div class="brand">Rolo</div>` +
    nav.map(([k,l],i)=>`<button class="navbtn ${v===k?'on':''}" onclick="go('${k}')"><span>${l}</span><span>0${i+1}</span></button>`).join('') +
    `<div class="mono grey" style="padding:22px 20px 8px">Groups</div>` +
    groups.map(g=>`<button class="grp" onclick="state.filter='${g.id}';go('index')"><span>${sw(g)}${g.name}</span><span>${pad(inG(g.id).length)}</span></button>`).join('') +
    `<button class="navbtn ${v==='settings'?'on':''}" style="margin-top:auto;border-top:1px solid var(--soft)" onclick="go('settings')"><span>Settings</span><span>05</span></button>` +
    `<button class="newbtn" style="margin-top:0" onclick="openAdd()">+ New person</button>`;
  document.getElementById('tabbar').innerHTML =
    nav.map(([k,l])=>`<button class="${v===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('') +
    `<button class="add" onclick="openAdd()" aria-label="Add person">+</button>`;
}
function go(v){ state.view=v; if(v==='drill'){state.fc.i=0;state.fc.flipped=false} render(); window.scrollTo(0,0) }
function openPerson(id){ state.person=id; go('person') }

function orbitSVG(){
  const C=210, R={1:78,2:132,3:186}, n=groups.length, step=2*Math.PI/n, start=-Math.PI/2;
  let s = `<svg class="orbit" viewBox="0 0 420 420" font-family="JetBrains Mono, monospace">`;
  [R[1],R[2],R[3]].forEach(r=>s+=`<circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="#8C8B86" stroke-width=".6" stroke-dasharray="2 4"/>`);
  groups.forEach((g,gi)=>{
    const a=start+gi*step;
    s+=`<line x1="${C+34*Math.cos(a)}" y1="${C+34*Math.sin(a)}" x2="${C+204*Math.cos(a)}" y2="${C+204*Math.sin(a)}" stroke="#D9D7D0" stroke-width=".8"/>`;
    const m=a+step/2, lx=C+201*Math.cos(m), ly=C+201*Math.sin(m);
    const dim = state.filter!=='all'&&state.filter!==g.id;
    if(state.colour) s+=`<circle cx="${lx-g.short.length*3.1-8}" cy="${ly}" r="3.5" fill="${g.c}" stroke="#111110" stroke-width=".4" opacity="${dim?.25:1}"/>`;
    s+=`<text x="${lx}" y="${ly}" font-size="9" letter-spacing=".8" text-anchor="middle" dominant-baseline="middle" fill="#111110" opacity="${dim?.25:1}" style="cursor:pointer" onclick="state.filter=state.filter==='${g.id}'?'all':'${g.id}';render()">${g.short.toUpperCase()}</text>`;
  });
  s+=`<circle cx="${C}" cy="${C}" r="24" fill="#111110"/><text x="${C}" y="${C+1}" font-size="9" letter-spacing="1" text-anchor="middle" dominant-baseline="middle" fill="#FBFAF7">YOU</text>`;
  groups.forEach((g,gi)=>{
    [1,2,3].forEach(ring=>{
      const ps=people.filter(p=>p.groups[0]===g.id&&p.ring===ring);
      ps.forEach((p,k)=>{
        const a=start+gi*step+step*(k+1)/(ps.length+1)+(ring===2?.08:0);
        const x=C+R[ring]*Math.cos(a), y=C+R[ring]*Math.sin(a);
        const dim = state.filter!=='all'&&!p.groups.includes(state.filter);
        s+=`<g class="node ${dim?'dim':''}" onclick="openPerson(${p.id})">
          <circle class="face" cx="${x}" cy="${y}" r="15" fill="${state.colour?gc(p):'#FBFAF7'}" stroke="#111110" stroke-width="${state.colour?.6:1}"/>
          <text class="ini" x="${x}" y="${y+.5}" font-size="9" font-family="Archivo Black, sans-serif" text-anchor="middle" dominant-baseline="middle" fill="${state.colour?on(gc(p)):'#111110'}">${ini(p)}</text>
          ${p.due?`<circle cx="${x+11}" cy="${y-11}" r="3.6" fill="#111110" stroke="#F3F2EE" stroke-width="1.5"/>`:''}
          <text x="${x}" y="${y+26}" font-size="8" text-anchor="middle" fill="#8C8B86">${p.first.toUpperCase()}</text></g>`;
      });
    });
  });
  return s+`</svg>`;
}

const row = (p,i,right='') => `<button class="ent" onclick="openPerson(${p.id})"><span class="n">${pad(i)}</span><div class="ph" style="background:${tint(p)}">${ini(p)}</div><div style="min-width:0"><b>${p.first} ${p.last}</b><small>${p.role} / ${p.team}</small></div>${right}</button>`;

const views = {
orbit(){
  const due=people.filter(p=>p.due), fol=people.filter(p=>p.follow);
  return `
  <div class="bar mono"><span>Wed 25 Nov</span><button class="grey" onclick="go('settings')">Settings</button></div>
  <div class="stats">
    <button onclick="go('index')"><b>${pad(people.length)}</b><span class="mono grey">People</span></button>
    <button onclick="go('drill')"><b>${pad(due.length)}</b><span class="mono grey">Due to drill</span></button>
    <button><b>${pad(fol.length)}</b><span class="mono grey">Follow-ups</span></button>
  </div>
  <div class="orbitwrap">
    <div>
      <div class="filters" style="border-top:0"><button class="${state.filter==='all'?'on':''}" onclick="state.filter='all';render()">All</button>${groups.map(g=>`<button class="${state.filter===g.id?'on':''}" onclick="state.filter='${g.id}';render()">${sw(g)}${g.short}</button>`).join('')}</div>
      ${orbitSVG()}
      <div class="legend mono grey"><span><i class="lg-due"></i>Due to drill</span><span><i class="lg-ring"></i>Inner ring = closer</span></div>
    </div>
    <div>
      <div class="sect mono" style="border-top:1px solid var(--ink)"><span>Due to drill</span><button class="grey" onclick="go('drill')">Start →</button></div>
      ${due.map((p,i)=>row(p,i+1)).join('')}
      <div class="sect mono" style="border-top:1px solid var(--ink);margin-top:-1px"><span>Follow-ups</span><span class="grey">${pad(fol.length)}</span></div>
      ${fol.map((p,i)=>row(p,i+1,`<span class="tagline">${p.follow}</span>`)).join('')}
    </div>
  </div>`;
},
index(){
  const q=state.q.toLowerCase();
  const list=people.filter(p=>(state.filter==='all'||p.groups.includes(state.filter))&&(!q||`${p.first} ${p.last} ${p.team} ${p.role} ${p.hook} ${p.met}`.toLowerCase().includes(q)));
  return `
  <div class="bar mono"><span>Rolo / Index</span><span class="grey">${pad(list.length)} entries</span></div>
  <div class="title">Index</div>
  <div class="filters"><button class="${state.filter==='all'?'on':''}" onclick="state.filter='all';render()">All</button>${groups.map(g=>`<button class="${state.filter===g.id?'on':''}" onclick="state.filter='${g.id}';render()">${g.short}</button>`).join('')}<button onclick="openGroup()">+ Group</button></div>
  <div class="search"><span class="mono grey">Search</span><input value="${state.q}" placeholder="Name, team or detail" oninput="state.q=this.value;render(true)"></div>
  <div id="list">${list.map((p,i)=>row(p,i+1,p.follow?`<span class="tagline">Follow up</span>`:'')).join('')||'<p class="pad mono grey" style="padding-top:20px">No matches</p>'}</div>`;
},
person(){
  const p=people.find(x=>x.id===state.person), idx=people.indexOf(p)+1;
  return `
  <div class="bar mono"><button onclick="go('index')">← Index</button><span class="grey">Entry ${pad(idx)}</span></div>
  <div class="profile" style="border-top:0">
    <div>
      <div class="portrait" style="background:${tint(p)}">${ini(p)}</div>
      <div class="pname">${p.first}<br>${p.last}</div>
      <div class="facts">
        <div><span>Role</span><span>${p.role}</span></div>
        <div><span>Team</span><span>${p.team}</span></div>
        <div><span>Met</span><span>${p.met}</span></div>
        <div><span>Groups</span><span>${p.groups.map(g=>G(g).name).join(', ')}</span></div>
        <div><span>Orbit</span><span class="rings">${['Inner','Middle','Outer'].map((l,i)=>`<button class="${p.ring===i+1?'on':''}" onclick="people.find(x=>x.id===${p.id}).ring=${i+1};render()">${l}</button>`).join('')}</span></div>
      </div>
    </div>
    <div>
      <div class="hook"><span class="mono grey">Memory hook</span><p>${p.hook}</p></div>
      ${p.follow?`<div class="hook"><span class="mono grey">Follow-up</span><p>${p.follow}</p></div>`:''}
      <div class="sect mono"><span>Notes</span><button class="grey">+ Add</button></div>
      ${p.notes.length?p.notes.map(([d,t])=>`<div class="note"><span class="mono grey">${d}</span><span>${t}</span></div>`).join(''):'<div class="note"><span class="mono grey">—</span><span class="grey">Nothing yet. Add something they mentioned.</span></div>'}
    </div>
  </div>`;
},
drill(){
  const deck=state.fc.deck==='all'?people.filter(p=>p.due):inG(state.fc.deck);
  const i=state.fc.i;
  const head=`<div class="bar mono"><span>Rolo / Drill</span><span class="grey">${String(Math.min(i+1,deck.length)).padStart(2,'0')}/${String(deck.length).padStart(2,'0')}</span></div>
  <div class="filters" style="border-top:0"><button class="${state.fc.deck==='all'?'on':''}" onclick="state.fc={i:0,flipped:false,deck:'all'};render()">Due</button>${groups.map(g=>`<button class="${state.fc.deck===g.id?'on':''}" onclick="state.fc={i:0,flipped:false,deck:'${g.id}'};render()">${g.short}</button>`).join('')}</div>`;
  if(i>=deck.length) return head+`<div class="drill"><div class="title" style="padding:40px 0 10px">Done.</div><p class="mono grey" style="margin-bottom:24px">${pad(deck.length)} reviewed</p><div class="rate" style="border-top:1px solid var(--ink);grid-template-columns:1fr"><button onclick="go('drill')">Again →</button></div></div>`;
  const p=deck[i];
  return head+`<div class="drill">
    <div class="prog">${deck.map((_,k)=>`<i class="${k<i?'done':''}"></i>`).join('')}</div>
    <div class="flip ${state.fc.flipped?'on':''}" onclick="state.fc.flipped=!state.fc.flipped;this.classList.toggle('on')">
      <div class="flip-in">
        <div class="fa" style="background:${deep(p)}"><div class="foot mono" style="border-top:0;border-bottom:1px solid #444"><span>${pad(people.indexOf(p)+1)}: Who?</span><span>${G(p.groups[0]).short}</span></div><div class="big">${ini(p)}</div><div class="foot mono" style="border-color:#444"><span>Tap to reveal</span><span>↻</span></div></div>
        <div class="fb"><div class="pname">${p.first}<br>${p.last}</div>
          <div class="facts"><div><span>Role</span><span>${p.role}</span></div><div><span>Team</span><span>${p.team}</span></div><div><span>Met</span><span>${p.met}</span></div></div>
          <div class="hk"><span class="mono grey" style="display:block;margin-bottom:4px">Memory hook</span>${p.hook}</div></div>
      </div>
    </div>
    <div class="rate"><button onclick="nextCard()">Forgot</button><button onclick="nextCard()">Almost</button><button onclick="nextCard()">Got it</button></div>
  </div>`;
},
groups(){
  return `<div class="bar mono"><span>Rolo / Groups</span><span class="grey">${pad(groups.length)} groups</span></div>
  <div class="title">Groups</div>
  <div style="border-top:1px solid var(--ink)">
  ${groups.map((g,i)=>`<button class="gl" onclick="state.filter='${g.id}';go('index')"><span class="mono grey">${pad(i+1)}</span><b>${sw(g)}${g.name}</b><span class="ct">${pad(inG(g.id).length)}</span></button>`).join('')}
  <button class="gl" onclick="openGroup()"><span class="mono grey">+</span><b class="grey">New group</b><span></span></button></div>`;
},
};
views.settings = function(){
  const tog=(on,fn)=>`<button class="tog ${on?'on':''}" onclick="${fn}" role="switch" aria-checked="${on}"><i></i></button>`;
  return `<div class="bar mono"><span>Rolo / Settings</span><span class="grey">v0.1</span></div>
  <div class="title">Settings</div>
  <div class="sect mono" style="border-top:1px solid var(--ink)"><span>Appearance</span></div>
  <div class="set"><div><b>Colour mode</b><small>Give each group its own colour across the orbit, index and drill. Off = black and white.</small></div>${tog(state.colour,`setColour(${!state.colour})`)}</div>
  <div class="set"><div><b>Preview</b><small>${groups.map(g=>`<span class="tagline" style="margin:6px 6px 0 0;display:inline-flex;align-items:center;gap:6px">${state.colour?`<i class="sw" style="background:${g.c};margin:0"></i>`:''}${g.short}</span>`).join('')}</small></div></div>
  ${state.colour?`<div class="sect mono" style="border-top:1px solid var(--ink);margin-top:-1px"><span>Group colours</span><span class="grey">Tap a swatch</span></div>
  ${groups.map(g=>`<div class="set"><div><b>${g.name}</b><small>${P(g.pc).firm} · ${P(g.pc).name}</small></div><div class="swatches">${palette.map(x=>`<button class="swb ${g.pc===x.id?'on':''}" style="background:${x.hex}" title="${x.firm} ${x.name}" onclick="setGroupColour('${g.id}','${x.id}')"></button>`).join('')}</div></div>`).join('')}
  <div class="sect mono" style="border-top:1px solid var(--ink);margin-top:-1px"><span>Firm palette</span><span class="grey">Tap to fine-tune</span></div>
  ${palette.map(x=>`<label class="set" style="cursor:pointer"><div><b>${x.firm}</b><small>${x.name} · ${x.hex.toUpperCase()}</small></div><span class="swl" style="background:${x.hex}"><input type="color" value="${x.hex}" onchange="setHex('${x.id}',this.value)"></span></label>`).join('')}`:''}
  <div class="sect mono" style="border-top:1px solid var(--ink);margin-top:-1px"><span>Account &amp; sync</span></div>
  <div class="set"><div><b>${state.acct?state.acct.label:'Not signed in'}</b><small>${state.acct?'Synced across your devices · Last sync just now':'Saved on this device only'}</small></div><span class="mono grey">${state.acct?'●&nbsp;Live':'○&nbsp;Local'}</span></div>
  <button class="set" style="width:100%" onclick="go('login')"><div><b>${state.acct?'Change planet &amp; constellation':'Sign in to sync'}</b></div><span class="mono grey">→</span></button>
  ${state.acct?`<button class="set" style="width:100%" onclick="state.acct=null;go('login')"><div><b>Switch account</b></div><span class="mono grey">→</span></button>`:''}
  <div class="sect mono" style="border-top:1px solid var(--ink);margin-top:-1px"><span>Data</span></div>
  <div class="set"><div><b>Export backup</b><small>Download everyone and their notes as a file</small></div><span class="mono grey">↓</span></div>
`;
};
const PLANETS=[['Mercury',3],['Venus',5],['Earth',5.5],['Mars',4],['Jupiter',10],['Saturn',8.5],['Uranus',7],['Neptune',7]];
const CONS=[['Crux','M6 3L6 15M1 8L11 8'],['Orion',''],['Lyra',''],['Cygnus',''],['Carina',''],['Centaurus',''],['Scorpius',''],['Pegasus','']];
function planetGlyph(r,ring){ return `<svg width="34" height="26" viewBox="0 0 34 26"><circle cx="17" cy="13" r="${r}" fill="currentColor"/>${ring?'<ellipse cx="17" cy="13" rx="14" ry="3.5" fill="none" stroke="currentColor" stroke-width="1"/>':''}</svg>` }
function conGlyph(i){ // tiny star patterns
  const pts=[[[17,3],[17,22],[9,11],[25,11],[21,18]],[[9,4],[25,5],[14,13],[17,13],[20,13],[10,22],[24,21]],[[17,4],[13,12],[21,12],[12,21],[22,21]],[[17,3],[17,23],[7,9],[27,9],[17,13]],[[5,18],[12,14],[19,15],[26,8],[29,20]],[[6,6],[12,12],[18,10],[24,16],[28,22],[16,21]],[[6,5],[11,9],[15,14],[19,19],[24,21],[29,17]],[[8,6],[26,6],[8,20],[26,20],[3,12]]][i];
  return `<svg width="34" height="26" viewBox="0 0 34 26">${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.7" fill="currentColor"/>`).join('')}</svg>` }
views.login = function(){
  const L=state.login, ready=L.name.trim()&&L.planet&&L.con;
  return `<div class="bar mono"><span>Rolo / Sign in</span><button class="grey" onclick="state.acct=state.acct||null;go('orbit')">Not now</button></div>
  <div class="title">Who's in<br>orbit?</div>
  <div class="loginwrap">
  <label class="fld" style="border-top:1px solid var(--ink)"><span class="mono grey">01 / Your name</span><input value="${L.name}" placeholder="Ella" oninput="state.login.name=this.value;document.getElementById('enter').disabled=!(this.value.trim()&&state.login.planet&&state.login.con)"></label>
  <div class="sect mono" style="border-top:1px solid var(--ink)"><span>02 / Pick a planet</span><span class="grey">${L.planet||''}</span></div>
  <div class="pick">${PLANETS.map(([n,r])=>`<button class="${L.planet===n?'on':''}" onclick="state.login.planet='${n}';render()">${planetGlyph(r,n==='Saturn')}<span class="mono">${n}</span></button>`).join('')}</div>
  <div class="sect mono" style="border-top:1px solid var(--ink)"><span>03 / Pick a constellation</span><span class="grey">${L.con||''}</span></div>
  <div class="pick">${CONS.map(([n],i)=>`<button class="${L.con===n?'on':''}" onclick="state.login.con='${n}';render()">${conGlyph(i)}<span class="mono">${n}</span></button>`).join('')}</div>
  <div class="sheetbtns" style="grid-template-columns:1fr;margin-top:0"><button id="enter" ${ready?'':'disabled'} onclick="state.acct={label:[state.login.name.trim(),state.login.planet,state.login.con].join(' · ')};go('orbit')">Enter orbit →</button></div>
  <p class="loginnote">Capitals and spaces in your name don't matter. New combination? You'll be asked to start a new orbit, and anything already on this device comes with you.</p>
  </div>`;
};
function nextCard(){ state.fc.i++; state.fc.flipped=false; render() }

function openAdd(){
  sheet(`<div class="title">New<br>person</div>
  <div class="photo mono grey">+ Add photo</div>
  <label class="fld"><span class="mono grey">Name</span><input placeholder="First and last name"></label>
  <label class="fld"><span class="mono grey">Role / team</span><input placeholder="Associate, Disputes"></label>
  <div class="fld"><span class="mono grey">Groups</span><div class="opts">${groups.map((g,i)=>`<button class="opt ${i===0?'on':''}" onclick="this.classList.toggle('on')">${g.short}</button>`).join('')}<button class="opt" onclick="openGroup()">+ New</button></div></div>
  <div class="fld"><span class="mono grey">Orbit</span><div class="opts">${['Inner','Middle','Outer'].map((l,i)=>`<button class="opt ${i===2?'on':''}">${l}</button>`).join('')}</div></div>
  <label class="fld"><span class="mono grey">Where you met</span><input placeholder="Clerkship welcome drinks"></label>
  <label class="fld"><span class="mono grey">Memory hook</span><input placeholder="One detail to remember them by"></label>
  <div class="sheetbtns"><button onclick="closeSheet()">Cancel</button><button onclick="closeSheet()">Save →</button></div>`);
}
function openGroup(){
  sheet(`<div class="title">New<br>group</div>
  <label class="fld"><span class="mono grey">Name</span><input placeholder="Summer clerkship 2026"></label>
  <div class="fld"><span class="mono grey">Colour (used in colour mode)</span><div class="swatches" style="margin-top:10px">${palette.map((x,i)=>`<button class="swb ${i===0?'on':''}" style="background:${x.hex}" title="${x.firm} ${x.name}" onclick="this.parentNode.querySelectorAll('.swb').forEach(b=>b.classList.remove('on'));this.classList.add('on')"></button>`).join('')}</div></div>
  <div class="sheetbtns"><button onclick="closeSheet()">Cancel</button><button onclick="closeSheet()">Create →</button></div>`);
}
function sheet(h){ document.getElementById('sheet').innerHTML=h; document.getElementById('scrim').classList.add('on') }
function closeSheet(){ document.getElementById('scrim').classList.remove('on') }
document.getElementById('scrim').addEventListener('click',e=>{ if(e.target.id==='scrim') closeSheet() });

function render(searchOnly){
  renderNav();
  const v=document.getElementById('view');
  if(searchOnly){ const t=document.createElement('div'); t.innerHTML=views.index(); v.querySelector('#list').replaceWith(t.querySelector('#list')); return; }
  v.innerHTML=views[state.view]();
}
render();
</script>
</body>
</html>
